services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: hybrid-rag-db:pg17-pg-textsearch-1.4.0
    container_name: hybrid-rag-db
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      POSTGRES_DB: hybrid_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data

volumes:
  pgdata17:
